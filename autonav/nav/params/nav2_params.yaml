amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.03
    alpha5: 0.04
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 11.5
    laser_max_range: 11.5
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 100
    max_particles: 800
    min_particles: 300
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "omnidirectional"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.2
    update_min_a: 0.05      # update more frequently for slow robots
    update_min_d: 0.05
    z_hit: 0.8
    z_max: 0.1
    z_rand: 0.25
    z_short: 0.05
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.01
    failure_tolerance: -1.0
    progress_checker_plugin: ""
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      ros__parameters:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.0
        movement_time_allowance: 120.0

dwb_controller:
  ros__parameters:
    controller_frequency: 10.0
    use_sim_time: False
    debug_trajectory_details: False

    # VERY SMOOTH SPEED LIMITS
    min_vel_x: -0.25
    max_vel_x: 0.25
    min_vel_y: -0.25
    max_vel_y: 0.25
    max_speed_xy: 0.25
    min_speed_xy: 0.02

    max_vel_theta: 0.6
    min_speed_theta: 0.01

    # VERY LOW ACCELERATION LIMITS
    acc_lim_x: 0.15
    acc_lim_y: 0.15
    acc_lim_theta: 0.3

    decel_lim_x: -0.15
    decel_lim_y: -0.15
    decel_lim_theta: -0.3

    vx_samples: 8
    vy_samples: 8
    vtheta_samples: 8

    sim_time: 3.0
    linear_granularity: 0.03
    angular_granularity: 0.025

    xy_goal_tolerance: 0.25
    yaw_goal_tolerance: 3.14159
    transform_tolerance: 0.5

    critics: ["BaseObstacle", "PathAlign", "PathDist", "GoalDist", "Oscillation"]

    BaseObstacle.scale: 20.0
    PathAlign.scale: 10.0
    PathDist.scale: 20.0
    GoalDist.scale: 8.0
    Oscillation.oscillation_reset_dist: 0.05
    Oscillation.oscillation_reset_angle: 0.20

bt_navigator:
  ros__parameters:
    use_sim_time: False
    bt_xml_filename: "bt_navigator.xml"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      robot_radius: 0.15

      plugin_names: ["obstacle_layer", "inflation_layer"]
      plugin_types: ["nav2_costmap_2d::ObstacleLayer", "nav2_costmap_2d::InflationLayer"]

      inflation_layer:
        inflation_radius: 0.25
        cost_scaling_factor: 3.0

      obstacle_layer:
        enabled: True

      always_send_full_costmap: True

      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True

  local_costmap_client:
    ros__parameters:
      use_sim_time: False

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      robot_radius: 0.15
      update_frequency: 2.0
      publish_frequency: 1.0

      inflation_layer:
        inflation_radius: 0.8
        cost_scaling_factor: 4.0

      obstacle_layer:
        enabled: True

      always_send_full_costmap: True

      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        obstacle_max_range: 11.5
        raytrace_max_range: 11.5

  global_costmap_client:
    ros__parameters:
      use_sim_time: False

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    recovery_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_recoveries/Spin"

    backup:
      plugin: "nav2_recoveries/BackUp"

    wait:
      plugin: "nav2_recoveries/Wait"

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "turtlebot3_world.yaml"

lifecycle_manager:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names:
      - map_server
      - amcl
      - world_model
      - dwb_controller
      - navfn_planner
      - bt_navigator
      - recoveries_server
      - local_costmap
      - global_costmap

navfn_planner:
  ros__parameters:
    use_sim_time: False
    tolerance: 0.2
    use_astar: false
    planner_frequency: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

world_model:
  ros__parameters:
    use_sim_time: False