slam_toolbox:
  ros__parameters:
    use_sim_time: false
    slam_params_file: ""
    mode: "mapping"
    map_file_name: ""
    odom_frame: "odom"
    base_frame: "base_link"
    scan_topic: "/scan"
    resolution: 0.05
    transform_publish_period: 0.05
    map_update_interval: 0.5
    use_scan_matching: true
    minimum_travel_distance: 0.01
    minimum_travel_heading: 0.01
    max_laser_range: 4.0
    min_laser_range: 0.15


